<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamD - Masuk / Daftar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: { canvas: '#FAFAF8' },
          boxShadow: {
            soft: '0 1px 2px rgb(16 24 40 / 0.04), 0 1px 3px rgb(16 24 40 / 0.06)',
            lift: '0 12px 32px -8px rgb(16 24 40 / 0.12), 0 4px 8px -4px rgb(16 24 40 / 0.04)',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-canvas font-sans text-stone-900 antialiased min-h-screen flex items-center justify-center px-4">

  <!-- Kartu utama -->
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-teal-700 tracking-tight">ExamD</h1>
      <p class="text-stone-500 mt-2 text-sm">Belajar jadi seru dengan quiz interaktif</p>
    </div>

    <div class="rounded-2xl bg-white p-8 shadow-soft ring-1 ring-stone-900/5">

      <!-- Toggle Login / Register -->
      <div class="flex bg-gray-100 rounded-lg p-1 mb-6">
        <button id="tab-login" type="button"
          class="flex-1 py-2 text-sm font-semibold rounded-md transition-all duration-200 bg-white text-teal-700 shadow-sm">
          Masuk
        </button>
        <button id="tab-register" type="button"
          class="flex-1 py-2 text-sm font-semibold rounded-md transition-all duration-200 text-gray-500 hover:text-stone-700">
          Daftar
        </button>
      </div>

      <!-- Pesan error / sukses -->
      <div id="alert-box" class="hidden mb-4 text-sm rounded-lg px-4 py-3 transition-all duration-200"></div>

      <!-- Form Login -->
      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-username" class="block text-[13px] font-semibold text-stone-600 mb-1.5">Username</label>
          <input id="login-username" type="text" required autocomplete="username"
            placeholder="masukkan username"
            class="w-full px-4 py-2.5 rounded-lg border border-stone-200 bg-white text-sm outline-none transition-all duration-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-100" />
        </div>
        <div>
          <label for="login-password" class="block text-[13px] font-semibold text-stone-600 mb-1.5">Password</label>
          <input id="login-password" type="password" required autocomplete="current-password"
            placeholder="masukkan password"
            class="w-full px-4 py-2.5 rounded-lg border border-stone-200 bg-white text-sm outline-none transition-all duration-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-100" />
        </div>
        <button type="submit" id="login-btn"
          class="w-full py-2.5 rounded-lg bg-teal-700 text-white text-sm font-semibold shadow-soft transition-all duration-200 hover:bg-teal-800 hover:shadow-lift active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
          Masuk
        </button>
      </form>

      <!-- Form Register (tersembunyi secara default) -->
      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label for="reg-username" class="block text-[13px] font-semibold text-stone-600 mb-1.5">Username</label>
          <input id="reg-username" type="text" required autocomplete="username"
            placeholder="3-30 karakter"
            class="w-full px-4 py-2.5 rounded-lg border border-stone-200 bg-white text-sm outline-none transition-all duration-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-100" />
        </div>
        <div>
          <label for="reg-password" class="block text-[13px] font-semibold text-stone-600 mb-1.5">Password</label>
          <input id="reg-password" type="password" required autocomplete="new-password"
            placeholder="minimal 6 karakter"
            class="w-full px-4 py-2.5 rounded-lg border border-stone-200 bg-white text-sm outline-none transition-all duration-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-100" />
        </div>
        <div>
          <label for="reg-confirm" class="block text-[13px] font-semibold text-stone-600 mb-1.5">Konfirmasi Password</label>
          <input id="reg-confirm" type="password" required autocomplete="new-password"
            placeholder="ulangi password"
            class="w-full px-4 py-2.5 rounded-lg border border-stone-200 bg-white text-sm outline-none transition-all duration-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-100" />
        </div>
        <button type="submit" id="register-btn"
          class="w-full py-2.5 rounded-lg bg-teal-700 text-white text-sm font-semibold shadow-soft transition-all duration-200 hover:bg-teal-800 hover:shadow-lift active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
          Daftar Sekarang
        </button>
      </form>

    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      Akun demo: <span class="font-mono">demo</span> / <span class="font-mono">demo123</span>
    </p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
