<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamD - Dashboard</title>

  <!-- Tipografi: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: { canvas: '#FAFAF8' },
          boxShadow: {
            soft: '0 1px 2px rgb(16 24 40 / 0.04), 0 1px 3px rgb(16 24 40 / 0.06)',
            lift: '0 20px 40px -12px rgb(16 24 40 / 0.18), 0 8px 16px -8px rgb(16 24 40 / 0.06)',
          },
        },
      },
    };
  </script>

  <style>
    @keyframes fade-up {
      from { transform: translateY(14px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .fade-up { animation: fade-up 0.5s ease-out both; }
  </style>
</head>
<body class="bg-canvas font-sans text-stone-900 antialiased min-h-screen">

  <!-- ===== Navigation Bar ===== -->
  <nav class="sticky top-0 z-20 border-b border-stone-200/70 bg-white/80 backdrop-blur-md">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5 sm:px-8">
      <a href="/dashboard.html" class="flex items-center gap-2.5 transition-opacity duration-200 hover:opacity-75">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-teal-700 font-extrabold text-white">E</span>
        <span class="text-xl font-extrabold tracking-tight">ExamD</span>
      </a>
      <div class="flex items-center gap-3">
        <div class="hidden items-center gap-2 rounded-full bg-stone-100 py-1.5 pl-3 pr-4 text-sm sm:flex">
          <span class="h-1.5 w-1.5 rounded-full bg-teal-600"></span>
          <span id="nav-username" class="font-medium text-stone-700"></span>
        </div>
        <button id="logout-btn"
          class="rounded-lg px-3.5 py-2 text-sm font-medium text-stone-500 transition-all duration-200 hover:bg-rose-50 hover:text-rose-600 active:scale-95">
          Keluar
        </button>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-5 sm:px-8">

    <!-- ===== Hero: sapaan + poin ===== -->
    <section class="flex flex-col gap-8 py-10 sm:py-14 lg:flex-row lg:items-end lg:justify-between">
      <div class="fade-up">
        <p class="mb-3 text-[11px] font-bold uppercase tracking-[0.22em] text-teal-700">Dashboard Siswa</p>
        <h1 id="greeting" class="max-w-xl text-3xl font-bold leading-tight tracking-tight sm:text-4xl">
          Selamat datang di <span class="text-teal-700">ExamD</span>!
        </h1>
        <p class="mt-3 max-w-md text-[15px] leading-relaxed text-stone-500">
          Latih pemahamanmu lewat quiz interaktif. Kumpulkan poin, ukur akurasi, dan naikkan peringkatmu.
        </p>
      </div>

      <!-- Kartu poin -->
      <div class="fade-up flex w-full max-w-xs items-center gap-5 rounded-2xl bg-white p-6 shadow-soft ring-1 ring-stone-900/5 transition-all duration-300 hover:shadow-lift" style="animation-delay: 80ms">
        <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 text-2xl shadow-sm">
          <span aria-hidden="true">⭐</span>
        </div>
        <div>
          <p class="text-xs font-medium uppercase tracking-wider text-stone-400">Total Poin</p>
          <p class="mt-0.5 text-3xl font-bold tracking-tight text-stone-900 tabular-nums" id="user-points">–</p>
        </div>
      </div>
    </section>

    <!-- ===== Grid Mata Pelajaran ===== -->
    <section class="pb-16">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3 border-t border-stone-200/80 pt-8">
        <h2 class="text-lg font-bold tracking-tight">Mata Pelajaran <span class="font-medium text-stone-400">· Kelas X</span></h2>
        <div class="flex items-center gap-4 text-[11px] font-semibold uppercase tracking-wider">
          <span class="inline-flex items-center gap-1.5 text-stone-500">
            <span class="h-2 w-2 rounded-full bg-teal-600"></span> Wajib
          </span>
          <span class="inline-flex items-center gap-1.5 text-stone-500">
            <span class="h-2 w-2 rounded-full bg-amber-500"></span> Peminatan
          </span>
        </div>
      </div>

      <div id="subject-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <!-- Kartu dirender oleh app.js -->
      </div>
    </section>

  </main>

  <footer class="border-t border-stone-200/70 py-8">
    <p class="text-center text-xs text-stone-400">© 2026 ExamD — Belajar lebih cerdas, bukan lebih lama.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
